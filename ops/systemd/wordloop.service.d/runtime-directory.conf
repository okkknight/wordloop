# Keep Miniflare's project-local runtime files writable by wordloop.service.
# The leading + runs these setup commands with full privileges even though the
# service itself runs as the unprivileged shipnow account.
[Service]
ExecStartPre=+/usr/bin/install -d -o shipnow -g shipnow -m 0755 /opt/boringmax/wordloop/tmp
ExecStartPre=+/usr/bin/chown -R shipnow:shipnow /opt/boringmax/wordloop/tmp
